name: Collaborative Workflow

on:
  push:
      branches:
        - main

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest

    steps:
      #Step 1:Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

     #Step 2: Update index.html
      - name: Update index.html
        run: |
          if [ "${{ github.actor }}" = "samikshathapar" ]; then
            sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(date)"'</p>' index.html
          elif [ "${{ github.actor }}" = "simonisabnis" ]; then
            sed -i '/<\/body>/i <p>Updated by Team Member 1 on '"$(date)"'</p>' index.html
          fi

      # Step 3: Update README
      - name: Update README
        run: |
          echo "### Updated by $GITHUB_ACTOR on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md
